# Hosted CPU tests and CUDA compilation. The CUDA runtime suite runs on a
# self-hosted runner (see cuda-nightly.yml); nothing here needs a GPU.
#
# Every job builds the library and the tests from a clean checkout with the
# dependencies CMake fetches itself (Eigen, libjpeg-turbo, zlib, GoogleTest),
# so a green run means "a user with a compiler and CMake can build this".
name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPENNN_THREADS: "4"

jobs:
  core-only:
    name: Linux GCC (vision and sequence disabled)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce publishable release scope
        run: |
          python tools/check_release_scope.py --package-kind binary
          if python tools/check_release_scope.py --package-kind full-source; then
            echo "Full source publication unexpectedly passed with unresolved assets."
            exit 1
          fi

      - name: Enforce code size and architecture
        run: |
          python -m pip install -r tools/code-quality-requirements.txt numpy==2.4.4
          python tools/check_code_quality.py
          python tools/check_architecture.py
          python -m unittest discover -s tests -p benchmark_runner_test.py

      - name: Reject a toolchain without OpenMP
        run: |
          if cmake -S . -B build-no-openmp -G Ninja \
              -DOpenNN_DISABLE_CUDA=ON \
              -DOpenNN_BUILD_TESTS=OFF \
              -DOpenNN_BUILD_EXAMPLES=OFF \
              -DOpenNN_BUILD_BENCHMARKS=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON \
              > missing-openmp.log 2>&1; then
            cat missing-openmp.log
            echo "Configuration unexpectedly accepted a toolchain without OpenMP."
            exit 1
          fi
          cat missing-openmp.log
          grep -F "OpenNN requires OpenMP C++ support" missing-openmp.log

      - name: Configure without vision and sequence models
        run: >
          cmake -S . -B build-core -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_VISION=OFF
          -DOpenNN_BUILD_TESTS=OFF
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF

      - name: Build and install the core package
        run: |
          if grep -E -- '-march=native|/arch:AVX2|-mcpu=apple-m1' build-core/compile_commands.json; then
            echo "Portable build unexpectedly contains a host-specific CPU flag."
            exit 1
          fi
          cmake --build build-core --target opennn --parallel
          cmake --install build-core --prefix "$PWD/core-prefix"
          python tools/check_installed_package.py "$PWD/core-prefix" --expect-cpu-target PORTABLE

      - name: Consume the installed core package
        run: |
          cmake -S tools/package_smoke -B build-core/package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/core-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DOpenNN_PACKAGE_EXPECT_NO_VISION=ON
          cmake --build build-core/package
          ./build-core/package/opennn_package_smoke

  linux:
    name: Linux ${{ matrix.compiler }} (CPU, Eigen)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13
            openmp: libgomp1
          - compiler: clang-17
            cc: clang-17
            cxx: clang++-17
            openmp: libomp-17-dev
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ${{ matrix.compiler }} ${{ matrix.openmp }}
          cmake --version

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model export test dependency
        run: python -m pip install numpy==2.4.4 pandas==2.3.3

      - name: Check dataset inventory
        run: python tools/check_dataset_manifest.py

      - name: Configure (CPU only, Eigen BLAS)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF

      - name: Build library and tests
        run: cmake --build build --target opennn opennn_tests opennn_response_tests --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Headers compile in isolation
        run: bash tools/check_headers.sh ${{ matrix.cxx }} "$PWD" "$(ls -d build/_deps/eigen-src 2>/dev/null || echo /usr/include/eigen3)"

      - name: Install and consume the package
        run: |
          cmake --install build --prefix "$PWD/prefix"
          cmake -E rename "$PWD/prefix" "$PWD/relocated-prefix"
          python tools/check_installed_package.py "$PWD/relocated-prefix" --expect-cpu-target PORTABLE
          for configuration in Release Debug; do
            cmake -S tools/package_smoke -B "build/package-$configuration" -G Ninja -DCMAKE_BUILD_TYPE="$configuration" -DCMAKE_PREFIX_PATH="$PWD/relocated-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
            cmake --build "build/package-$configuration"
            "./build/package-$configuration/opennn_package_smoke"
          done

      - name: Verify reference data and model recipes
        if: matrix.compiler == 'gcc-13'
        run: |
          python -m pip install xlrd==2.0.2
          python tools/reproduce_datasets.py --datasets iris concrete --cache "$RUNNER_TEMP/dataset-sources" --output "$RUNNER_TEMP/reproduced-data"
          cmake -S tools/reproduce_models -B build/model-generator -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/relocated-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
          cmake --build build/model-generator --parallel 2
          python tools/reproduce_models/verify.py --executable build/model-generator/opennn_reproduce_models --data-root "$RUNNER_TEMP/reproduced-data" --output "$RUNNER_TEMP/reference-models"

      - name: Preserve model verification report
        if: always() && matrix.compiler == 'gcc-13'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: reference-model-verification
          path: |
            ${{ runner.temp }}/reproduced-data/reproduction.json
            ${{ runner.temp }}/reference-models/verification.json

  shared-library:
    name: Linux GCC (shared-library package)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13
      - name: Configure shared library
        run: >
          cmake -S . -B build-shared -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_ENABLE_LTO=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_SHARED=ON
          -DOpenNN_BUILD_VISION=OFF
          -DOpenNN_BUILD_TESTS=OFF
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF
      - name: Build, install and consume shared package
        run: |
          cmake --build build-shared --target opennn --parallel
          cmake --install build-shared --prefix "$PWD/shared-prefix"
          python tools/check_installed_package.py "$PWD/shared-prefix" --expect-cpu-target PORTABLE
          cmake -S tools/package_smoke -B build-shared/package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/shared-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DOpenNN_PACKAGE_EXPECT_NO_VISION=ON
          cmake --build build-shared/package
          LD_LIBRARY_PATH="$PWD/shared-prefix/lib:${LD_LIBRARY_PATH:-}" ./build-shared/package/opennn_package_smoke

  macos:
    name: macOS AppleClang (portable package)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMP
        run: brew install libomp ninja
      - name: Configure portable core
        run: >
          cmake -S . -B build-macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_ENABLE_LTO=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_VISION=OFF
          -DOpenNN_BUILD_TESTS=OFF
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF
      - name: Build, install and consume package
        run: |
          cmake --build build-macos --target opennn --parallel
          cmake --install build-macos --prefix "$PWD/macos-prefix"
          python3 tools/check_installed_package.py "$PWD/macos-prefix" --expect-cpu-target PORTABLE
          cmake -S tools/package_smoke -B build-macos/package -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/macos-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DOpenNN_PACKAGE_EXPECT_NO_VISION=ON
          cmake --build build-macos/package
          ./build-macos/package/opennn_package_smoke

  static-analysis:
    name: Clang static analysis
    runs-on: ubuntu-24.04
    env:
      CC: clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4
      - name: Install analyzer
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-17 clang-tidy-17 libomp-17-dev
      - name: Configure analysis database
        run: >
          cmake -S . -B build-analysis -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_ENABLE_LTO=OFF
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON
          -DOpenNN_BUILD_VISION=OFF
          -DOpenNN_BUILD_TESTS=OFF
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF
      - name: Reject critical analyzer findings
        run: |
          for source in \
              opennn/core/json.cpp \
              opennn/core/device_backend.cpp \
              opennn/core/device_resources.cpp \
              opennn/network/forward_propagation.cpp \
              opennn/network/network_io.cpp \
              opennn/network/layers/scaling_layer.cpp \
              opennn/dataset/tabular_dataset_io.cpp \
              opennn/response_optimization/expression_evaluator.cpp \
              opennn/response_optimization/genetic_response.cpp \
              opennn/training/optimizer.cpp; do
            clang-tidy-17 "$source" -p build-analysis \
              --checks='-*,clang-analyzer-core.*,clang-analyzer-cplusplus.NewDelete,clang-analyzer-cplusplus.NewDeleteLeaks,bugprone-use-after-move' \
              --warnings-as-errors='*'
          done

  coverage:
    name: Linux GCC (coverage baseline)
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
      OPENNN_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-13 g++-13 gcovr
          python -m pip install numpy==2.4.4 pandas==2.3.3
      - name: Configure coverage build
        run: >
          cmake -S . -B build-coverage -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="--coverage -O0 -g -DNDEBUG"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_ENABLE_LTO=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF
      - name: Build and run coverage suite
        run: |
          cmake --build build-coverage --target opennn_tests --parallel 2
          ./build-coverage/bin/opennn_tests
      - name: Enforce and publish baseline
        run: |
          gcovr --root "$PWD" --filter 'opennn/' --exclude 'opennn/core/cuda/' --exclude '.*\.cu$' \
            --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
            --json-summary coverage-summary.json --json-summary-pretty \
            --html-details coverage.html \
            --fail-under-line 70 --fail-under-branch 35
          python tools/check_coverage.py coverage-summary.json
      - name: Preserve coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-baseline
          path: |
            coverage-summary.json
            coverage*.html

  sanitizers:
    name: Linux Clang (ASan, UBSan)
    runs-on: ubuntu-24.04
    # A clean instrumented build took 48 minutes on a hosted worker. Allow
    # both test executables to finish; their individual CTest limits still apply.
    timeout-minutes: 120
    env:
      CC: clang-17
      CXX: clang++-17
      # Buffer tests deliberately request impossible allocations and verify
      # std::bad_alloc preserves the old buffer. Let malloc fail normally.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:allocator_may_return_null=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-17 libomp-17-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model export test dependencies
        run: python -m pip install numpy==2.4.4 pandas==2.3.3
      - name: Configure sanitizers and JSON fuzzer
        run: cmake --preset verify-sanitizers -B build-sanitizers -DOpenNN_BUILD_FUZZERS=ON
      - name: Build both test executables
        run: |
          nproc
          free -h
          /usr/bin/time -v -o build-sanitizers/build-resources.txt \
            cmake --build build-sanitizers --target opennn_tests opennn_response_tests opennn_json_fuzz --parallel 2
      - name: Check memory and undefined behavior
        run: ctest --test-dir build-sanitizers --output-on-failure
      - name: Fuzz strict JSON parsing
        run: ./build-sanitizers/bin/opennn_json_fuzz -runs=20000 -max_len=8192 tools/fuzz/corpus
      - name: Preserve test log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-test-log
          include-hidden-files: true
          path: |
            build-sanitizers/Testing/Temporary/
            build-sanitizers/build-resources.txt
            build-sanitizers/.ninja_log

  cuda-compile:
    name: Linux CUDA 12.9 (compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA build dependencies
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build g++-13 \
            cuda-minimal-build-12-9 cuda-driver-dev-12-9 cuda-nvml-dev-12-9 \
            cuda-nvrtc-dev-12-9 libcublas-dev-12-9 libcurand-dev-12-9 \
            libcudnn9-dev-cuda-12=9.10.2.21-1 \
            libcudnn9-headers-cuda-12=9.10.2.21-1 \
            libcudnn9-cuda-12=9.10.2.21-1
          echo "/usr/local/cuda-12.9/bin" >> "$GITHUB_PATH"

      - name: Configure CUDA without a GPU
        run: >
          cmake -S . -B build-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=86
          -DCUDAToolkit_ROOT=/usr/local/cuda-12.9
          -DOpenNN_REQUIRE_CUDA=ON
          -DOpenNN_ENABLE_LTO=OFF
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF

      - name: Compile library and both test executables
        run: cmake --build build-cuda --target opennn_tests opennn_response_tests --parallel 2

  windows:
    name: Windows MSVC 2022 (CPU, Eigen)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install model export test dependency
        run: python -m pip install numpy==2.4.4 pandas==2.3.3

      - name: Check dataset inventory
        run: python tools/check_dataset_manifest.py

      - name: Configure (CPU only, Eigen BLAS)
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DOpenNN_DISABLE_CUDA=ON
          -DOpenNN_ENABLE_MKL=OFF
          -DOpenNN_CPU_TARGET=PORTABLE
          -DOpenNN_BUILD_EXAMPLES=OFF
          -DOpenNN_BUILD_BENCHMARKS=OFF

      - name: Build library and tests
        run: cmake --build build --config Release --target opennn opennn_tests opennn_response_tests --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install and consume the relocated package
        run: |
          cmake --install build --config Release --prefix "$pwd/prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -E rename "$pwd/prefix" "$pwd/relocated-prefix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_installed_package.py "$pwd/relocated-prefix" --expect-cpu-target PORTABLE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S tools/package_smoke -B build/package -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$pwd/relocated-prefix" -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/package --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/package/Release/opennn_package_smoke.exe
